services:
    app:
        build: .
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/api/health') === false ? 1 : 0);"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: tecnora
            POSTGRES_USER: tecnora
            POSTGRES_PASSWORD: secret
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tecnora -d tecnora"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata: {}
    vendor: {}
