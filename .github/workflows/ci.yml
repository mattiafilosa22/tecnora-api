name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, zip, intl, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/pint --test

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tecnora_test
          POSTGRES_USER: tecnora
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecnora -d tecnora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tecnora_test
      DB_USERNAME: tecnora
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, zip, intl, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: php artisan migrate --force

      - run: php artisan test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose up -d --build --wait --wait-timeout 300

      - run: curl -fsS http://localhost:8000/api/health | grep -F '"db":true'

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
